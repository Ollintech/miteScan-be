name: CI/CD Pipeline - MiteScan API

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # -------------------------------------------------------------
  # STAGE 1: CI (Continuous Integration) - Validação de Sintaxe
  # -------------------------------------------------------------
  lint_and_compile:
    name: 🧪 CI - Verificação do Código
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 🔍 Verificação de Sintaxe do Projeto
        run: |
          python -m compileall app/

  # -------------------------------------------------------------
  # STAGE 2: CD (Continuous Deployment) - Disparo do Deploy
  # -------------------------------------------------------------
  deploy:
    name: 🚀 CD - Deploy Automático no Render
    needs: lint_and_compile
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: 📡 Disparar Webhook do Render
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"