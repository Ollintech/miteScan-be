name: CI/CD Pipeline - MiteScan API

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # -------------------------------------------------------------
  # STAGE 1: CI (Continuous Integration) - Validação e Testes
  # -------------------------------------------------------------
  lint_and_test:
    name: 🧪 CI - Verificação e Testes
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: 📦 Instalar Dependências e Pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt

      - name: 🔍 Verificação de Sintaxe
        run: |
          python -m compileall app/

      - name: 🧪 Executar Testes Automatizados
        run: |
          pytest

  # -------------------------------------------------------------
  # STAGE 2: CD (Continuous Deployment) - Disparo do Deploy
  # -------------------------------------------------------------
  deploy:
    name: 🚀 CD - Deploy Automático no Render
    needs: lint_and_test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: 📡 Disparar Webhook do Render
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"